{% extends 'base.html' %}
{% block title %}Parking fees | SmartPark{% endblock %}
{% block content %}
<section class="page-head"><div class="container"><p class="eyebrow">FEE RATES</p><h1>Parking pricing</h1><p class="text-muted mb-0">Users pay parking fees only. There is no subscription to use SmartPark.</p></div></section>
<section class="section pt-2"><div class="container" style="max-width:720px"><div class="content-panel">
    <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Rate card name<input class="form-control" name="name" value="{{ pricing.name if pricing else 'Standard hourly' }}" required></label>
    <div class="row g-3"><div class="col-md-4"><label>Hourly (INR)<input class="form-control" type="number" step="0.01" name="hourly_price" value="{{ pricing.hourly_price if pricing else 30 }}" required></label></div>
    <div class="col-md-4"><label>Extra hour (INR)<input class="form-control" type="number" step="0.01" name="additional_hour_price" value="{{ pricing.additional_hour_price if pricing else 20 }}" required></label></div>
    <div class="col-md-4"><label>Daily (INR)<input class="form-control" type="number" step="0.01" name="daily_price" value="{{ pricing.daily_price if pricing else 250 }}"></label></div></div>
    <label>Grace period (minutes)<input class="form-control" type="number" name="grace_period_minutes" value="{{ pricing.grace_period_minutes if pricing else 10 }}"></label>
    <label class="check"><input type="checkbox" name="user_parking_free" {% if parking_free %}checked{% endif %}> Temporarily waive parking fees (demo only)</label>
    <button class="btn btn-primary w-100 mt-2">Save parking fees</button>
  </form>
  <p class="booking-note mt-4 mb-0"><i class="bi bi-info-circle"></i><span>For month/year rate cards, use <a href="{{ url_for('admin.payment_policies') }}">Fee policies</a>.</span></p>
</div></div></section>
{% endblock %}
