{% extends 'base.html' %}
{% block title %}Set new password | SmartPark{% endblock %}
{% block content %}
<style>
.rp-wrap {
  min-height: calc(100vh - 120px);
  display: grid; place-items: center;
  padding: 60px 20px;
  background: radial-gradient(ellipse at 50% 0%, rgba(8,127,140,.12), transparent 60%), var(--bg);
}
.rp-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 24px; padding: 48px 44px;
  width: 100%; max-width: 440px; box-shadow: var(--shadow);
  animation: rpIn .55s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes rpIn {
  from { opacity:0; transform: scale(.92) translateY(24px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}
@media (max-width:575px) { .rp-card { padding: 32px 24px; } }
.rp-icon {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(8,127,140,.15), rgba(20,172,82,.12));
  display: grid; place-items: center; font-size: 2rem; color: var(--primary);
  margin: 0 auto 28px;
  animation: iconPulse 2.5s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(8,127,140,.3); }
  50%      { box-shadow: 0 0 0 14px rgba(8,127,140,.0); }
}
.rp-card h1 { font-size: 1.8rem; text-align: center; margin: 0 0 8px; }
.rp-card .sub { color: var(--muted); font-size: .88rem; text-align: center; margin-bottom: 32px; }
.rp-group { position: relative; margin-bottom: 18px; }
.rp-group label { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.rp-group input {
  width: 100%; background: var(--bg); border: 2px solid var(--line);
  border-radius: 12px; color: var(--ink); padding: 14px 46px 14px 18px;
  font-size: .95rem; font-family: 'DM Sans', sans-serif;
  transition: all .22s cubic-bezier(.34,1.56,.64,1);
}
.rp-group input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(8,127,140,.15);
  background: var(--surface); transform: translateY(-1px);
}
.pw-toggle { position: absolute; right: 12px; bottom: 13px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: .95rem; padding: 2px 4px; transition: color .2s; }
.pw-toggle:hover { color: var(--primary); }
.pw-strength { margin-top: 6px; display: flex; gap: 4px; }
.pw-bar { flex:1; height:3px; border-radius:999px; background: var(--line); transition: background .3s; }
.pw-bar.weak   { background: #e55353; }
.pw-bar.medium { background: #f59e0b; }
.pw-bar.strong { background: #14ac52; }
.pw-label { font-size: .68rem; color: var(--muted); margin-top: 4px; }
.rp-submit {
  width: 100%; padding: 15px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, var(--primary) 0%, #0a6973 100%);
  color: #fff; font-size: 1rem; font-weight: 700;
  font-family: 'Space Grotesk', sans-serif; cursor: pointer;
  transition: all .25s cubic-bezier(.34,1.56,.64,1); margin-top: 8px; position: relative; overflow: hidden;
}
.rp-submit::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.15),transparent); opacity:0; transition:opacity .3s; }
.rp-submit:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(8,127,140,.35); }
.rp-submit:hover::after { opacity:1; }
html[data-theme=dark] .rp-group input { background: var(--bg); border-color: var(--line); }
html[data-theme=dark] .rp-group input:focus { background: rgba(8,127,140,.07); }
</style>

<section class="rp-wrap">
  <div class="rp-card">
    <div class="rp-icon"><i class="bi bi-key-fill"></i></div>
    <p class="eyebrow text-center">SECURE UPDATE</p>
    <h1>Choose a new password</h1>
    <p class="sub">Use at least 8 characters with a mix of letters, numbers, and symbols.</p>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="rp-group">
        <label>New password</label>
        <input type="password" name="password" id="rpPw" required minlength="8" placeholder="Min 8 characters" autofocus>
        <button type="button" class="pw-toggle" onclick="togglePw('rpPw',this)"><i class="bi bi-eye"></i></button>
        <div class="pw-strength">
          <div class="pw-bar" id="b1"></div>
          <div class="pw-bar" id="b2"></div>
          <div class="pw-bar" id="b3"></div>
        </div>
        <div class="pw-label" id="rpLabel">Enter a strong password</div>
      </div>

      <div class="rp-group">
        <label>Confirm password</label>
        <input type="password" name="confirm_password" id="rpConf" required minlength="8" placeholder="Repeat password">
        <button type="button" class="pw-toggle" onclick="togglePw('rpConf',this)"><i class="bi bi-eye"></i></button>
      </div>

      <button type="submit" class="rp-submit">
        Update password &nbsp;<i class="bi bi-check-lg"></i>
      </button>
    </form>
  </div>
</section>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
const rpPw = document.getElementById('rpPw');
const bars = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3')];
const lbl  = document.getElementById('rpLabel');
rpPw?.addEventListener('input', () => {
  const v = rpPw.value; let s = 0;
  if (v.length >= 8) s++;
  if (/[A-Z]/.test(v) && /[0-9]/.test(v)) s++;
  if (/[^A-Za-z0-9]/.test(v)) s++;
  const cls  = ['weak','medium','strong'];
  const lbls = ['Weak — add numbers & symbols','Medium — add a symbol','Strong password!'];
  bars.forEach((b,i) => { b.className = 'pw-bar' + (i < s ? (' ' + cls[Math.max(s-1,0)]) : ''); });
  lbl.textContent = v.length ? lbls[Math.max(s-1,0)] : 'Enter a strong password';
});
</script>
{% endblock %}
