{% extends 'base.html' %}
{% block title %}Forgot password | SmartPark{% endblock %}
{% block content %}
<style>
.fp-wrap {
  min-height: calc(100vh - 120px);
  display: grid; place-items: center;
  padding: 60px 20px;
  background: radial-gradient(ellipse at 50% 0%, rgba(8,127,140,.12), transparent 60%), var(--bg);
}
.fp-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 48px 44px;
  width: 100%; max-width: 440px;
  box-shadow: var(--shadow);
  animation: fpIn .55s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes fpIn {
  from { opacity:0; transform: scale(.92) translateY(24px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}
@media (max-width:575px) { .fp-card { padding: 32px 24px; } }
.fp-icon {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(8,127,140,.15) 0%, rgba(20,172,82,.12) 100%);
  display: grid; place-items: center;
  font-size: 2rem; color: var(--primary);
  margin: 0 auto 28px;
  animation: iconPulse 2.5s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(8,127,140,.3); }
  50%      { box-shadow: 0 0 0 14px rgba(8,127,140,.0); }
}
.fp-card h1 { font-size: 1.8rem; text-align: center; margin: 0 0 8px; }
.fp-card .sub { color: var(--muted); font-size: .88rem; text-align: center; margin-bottom: 32px; line-height: 1.6; }
.fp-group { position: relative; margin-bottom: 20px; }
.fp-group label { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.fp-group input {
  width: 100%; background: var(--bg); border: 2px solid var(--line);
  border-radius: 12px; color: var(--ink); padding: 14px 48px 14px 18px;
  font-size: .95rem; font-family: 'DM Sans', sans-serif;
  transition: all .22s cubic-bezier(.34,1.56,.64,1);
}
.fp-group input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(8,127,140,.15);
  background: var(--surface); transform: translateY(-1px);
}
.fp-icon-field { position: absolute; right: 16px; bottom: 16px; color: var(--muted); pointer-events: none; }
.fp-submit {
  width: 100%; padding: 15px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, var(--primary) 0%, #0a6973 100%);
  color: #fff; font-size: 1rem; font-weight: 700;
  font-family: 'Space Grotesk', sans-serif; cursor: pointer;
  transition: all .25s cubic-bezier(.34,1.56,.64,1); position: relative; overflow: hidden;
}
.fp-submit::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.15),transparent); opacity:0; transition:opacity .3s; }
.fp-submit:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(8,127,140,.35); }
.fp-submit:hover::after { opacity:1; }
.fp-submit:active { transform: translateY(0); }
.fp-back { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; font-size: .88rem; color: var(--muted); text-decoration: none; transition: color .2s; }
.fp-back:hover { color: var(--primary); }
html[data-theme=dark] .fp-group input { background: var(--bg); border-color: var(--line); }
html[data-theme=dark] .fp-group input:focus { background: rgba(8,127,140,.07); }
</style>

<section class="fp-wrap">
  <div class="fp-card">
    <div class="fp-icon"><i class="bi bi-shield-lock-fill"></i></div>
    <p class="eyebrow text-center">ACCOUNT RECOVERY</p>
    <h1>Reset your password</h1>
    <p class="sub">Enter your account email and we'll send you a reset link to get back in.</p>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="fp-group">
        <label>Email address</label>
        <input type="email" name="email" required autofocus placeholder="you@email.com">
        <i class="bi bi-envelope fp-icon-field"></i>
      </div>
      <button type="submit" class="fp-submit">
        Send reset link &nbsp;<i class="bi bi-send"></i>
      </button>
    </form>

    <a href="{{ url_for('auth.login') }}" class="fp-back">
      <i class="bi bi-arrow-left"></i> Back to sign in
    </a>
  </div>
</section>
{% endblock %}
