{% extends 'base.html' %}{% block title %}Create account | SmartPark{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card wide"><p class="eyebrow">GET MOVING</p><h1>Create your account</h1><p class="text-muted mb-4">Reserve smarter, keep every trip in one place.</p><form method="post" class="row g-3"><div class="col-md-6"><label>Full name<input class="form-control" name="full_name" required></label></div><div class="col-md-6"><label>Username<input class="form-control" name="username" required></label></div><div class="col-md-6"><label>Email<input class="form-control" type="email" name="email" required></label></div><div class="col-md-6"><label>Phone<input class="form-control" name="phone"></label></div><div class="col-md-6"><label>Password<input class="form-control" type="password" name="password" minlength="8" required></label></div><div class="col-md-6"><label>Confirm password<input class="form-control" type="password" name="confirm_password" minlength="8" required></label></div><div class="col-12"><button class="btn btn-primary w-100">Create account <i class="bi bi-arrow-right"></i></button></div></form><p class="text-center mt-4 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></section>{% endblock %}
