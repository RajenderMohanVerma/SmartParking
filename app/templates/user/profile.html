{% extends 'base.html' %}{% block title %}Your profile | SmartPark{% endblock %}{% block content %}<section class="page-head"><div class="container"><p class="eyebrow">ACCOUNT</p><h1>Profile</h1></div></section><section class="section pt-2"><div class="container" style="max-width:640px"><div class="content-panel"><form method="post"><label>Full name<input class="form-control" name="full_name" value="{{ current_user.full_name }}" required></label><label>Email<input class="form-control" value="{{ current_user.email }}" disabled></label><label>Username<input class="form-control" value="{{ current_user.username }}" disabled></label><label>Phone<input class="form-control" name="phone" value="{{ current_user.phone or '' }}"></label><label>Address<textarea class="form-control" name="address" rows="3">{{ current_user.address or '' }}</textarea></label><button class="btn btn-primary w-100">Save profile</button></form></div></div></section>{% endblock %}
